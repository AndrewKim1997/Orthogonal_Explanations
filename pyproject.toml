[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orthogonal-explanations"
version = "0.1.0"
description = "Reusable local explanation panels for financial econometrics with COLA"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Dongseok Kim"}]
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.3,<2"]

[project.urls]
Repository = "https://github.com/AndrewKim1997/OrthogonalExplanations"
Issues = "https://github.com/AndrewKim1997/OrthogonalExplanations/issues"

[project.optional-dependencies]
experiments = [
  "pandas>=2,<3",
  "scipy>=1.11,<2",
  "xgboost>=2.1,<4",
  "lime==0.2.0.1",
  "matplotlib>=3.7,<4",
  "SciencePlots>=2.1,<3",
  "tueplots>=0.0.17,<1",
  "pyarrow>=16",
  "joblib>=1.3,<2",
  "threadpoolctl>=3",
  "tqdm>=4",
  "ipython>=8",
  "requests>=2.31,<3",
  "statsmodels>=0.14,<0.16",
  "linearmodels>=6,<8",
]

[tool.setuptools.packages.find]
where = ["src"]
